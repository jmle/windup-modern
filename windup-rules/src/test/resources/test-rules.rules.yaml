rules:
  id: "test-ejb-migration"
  phase: MIGRATION_RULES
  source-technology:
    id: "eap"
    version: "[6,7)"
  target-technology:
    id: "eap"
    version: "[7,)"
  rules:
    - id: "ejb-001"
      when:
        java-class:
          references: "javax.ejb.{*}"
          location: ANNOTATION
      perform:
        hint:
          title: "EJB annotation must be migrated"
          message: "Replace javax.ejb with jakarta.ejb"
          effort: 1
          category: MANDATORY
          link:
            title: "Migration Guide"
            url: "https://example.com/ejb-migration"

    - id: "ejb-002"
      when:
        xml-matches:
          xpath: "//jee:ejb-jar"
          namespaces:
            jee: "http://xmlns.jcp.org/xml/ns/javaee"
      perform:
        classification:
          title: "EJB Deployment Descriptor"
          description: "This is an EJB deployment descriptor that needs updating."
          effort: 3
          category: MANDATORY

    - id: "ejb-003"
      when:
        file-content:
          pattern: "javax\\.ejb\\."
          filename: "*.java"
      perform:
        technology-tag:
          tag: "EJB"
          level: IMPORTANT
