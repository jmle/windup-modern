# Koncur Parity Ledger
#
# Durable record of every known divergence between the NATIVE JAVA provider and vanilla
# koncur `main`'s Go-generated goldens (the Go provider's output of record). This replaces the
# forked `koncur-new-java-provider` golden branch, which kept only edited goldens and lost the
# reasoning. See TEST_PLAN.md (L4) for the model.
#
# The differential is a SINGLE run (new provider vs vanilla main); every divergence is TRIAGED,
# never auto-failed. Re-syncing onto a newer koncur is a DELTA: entries that still apply are carried
# forward; only new/changed divergences are triaged. CI fails on any `java-wrong` regression OR any
# divergence not explained by an accepted ledger entry.
#
# classification:
#   go-wrong    (a) Java correct, Go wrong          -> accept Java output; golden would change
#   java-wrong  (b) Go correct, Java wrong          -> real regression / provider bug
#   benign      (c) ordering/dedup/line/uri noise   -> handled by comparator normalization
# status: accepted | fixed | fixed-pending-ci | open | needs-triage | excluded
# direction: java-fewer | java-more | java-different

version: 1

# The Go system-of-record this ledger was triaged against, plus the prior-triage fork point.
baseline:
  koncur_go_ref: 5ce4fb0ffd4fab2a7e4474ac15b8c00368d763a5   # upstream/main @ 2026-10-20 (re-sync target)
  prior_triage_merge_base: 70eee774c3180c27d8a296645de040fc64512bfc
  forked_golden_branch_tip: 002c902ede9d3fe5f08ab96d0e5dacc7dc2112a9  # to retire (MTA-8152)
  ruleset_ref: TODO            # pin analyzer-lsp / rulesets version used for the run
  kantra_image: TODO           # pin to a digest, not :latest
  java_provider_image: TODO    # tag/digest of the provider under test

# Comparator normalization applied before diffing (see TEST_PLAN.md L4).
comparator:
  order_insensitive: true
  sort_key: [ruleset, rule, uri, line]
  dedup_key: [uri, line, rule]
  uri_normalization: true           # normalize file:// + base-dir; map java-project/ -> logical source
  source_match: exact               # application source: exact (uri, line)
  nonsource_match: count-per-file   # decompiled (java-project/) + dependency (m2): match by incident
                                    # count per file, ignoring line (decompiler line numbers differ)
  compare_fields: [ruleset, rule, uri, line]
  ignore_fields: [effort, message]  # unless a test explicitly asserts them
  ignore_empty_rulesets: true

entries:
  # ── Seeded from FAILING_TESTS.md ──────────────────────────────────────────────

  - id: daytrader-ee-to-quarkus-00020-overmatch
    test: daytrader
    ruleset: ee-to-quarkus
    rule: ee-to-quarkus-00020
    location: annotation
    classification: go-wrong
    direction: java-fewer
    summary: >
      Go over-matches @MessageDriven onto unrelated EJB annotations at nearby lines
      (@Resource, @Override, @TransactionAttribute); Java reports only real @MessageDriven usages.
    incidents:
      - uri_contains: TradeSLSBBean.java
        name: Override
        lines: [160, 217, 248, 262, 268, 302, 398, 413, 546]
      - uri_contains: TradeSLSBBean.java
        name: TransactionAttribute
        lines: [646]
      - uri_contains: [DTBroker3MDB.java, DTStreamer3MDB.java, TradeSLSBBean.java]
        name: Resource
    resolution: Accept Java output; 13 spurious Go incidents (49 -> 36 for the rule).
    evidence: FAILING_TESTS.md#2-daytrader
    status: accepted
    first_seen: 2026-08-18

  - id: seam-booking-source-only-annotation-misses
    test: seam-booking
    # Direction-scoped (not test-wide blanket): accept "java finds MORE" anywhere in seam — more incidents
    # (java-more) and more technology tags (tag-added) — the known Go source-only limitation (it misses
    # annotations across many rules). Any "java finds FEWER" (java-fewer incidents or tag-dropped) is a
    # real regression: NOT auto-passed, it fails the gate. Differential run 40327871051: 278 java-more +
    # 10 tag-added, 0 java-fewer, 0 tag-dropped.
    direction: [java-more, tag-added]
    classification: go-wrong
    summary: >
      In source-only mode Go/JDTLS cannot confirm an annotation's type without library bytes, so it
      misses real @Entity, @NamedQuery, Hibernate annotations and javax imports. Java resolves the FQN
      from imports and matches correctly, so it reports more sites across the seam rulesets.
    resolution: >
      Accept Java output; 5 rulesets' goldens grow (seam violations/insights/tags added, new `hibernate`
      ruleset). ~45 "errors" were Go misses.
    evidence: FAILING_TESTS.md#4-seam-booking
    status: accepted
    first_seen: 2026-08-18

  - id: acmeair-binary-project-structure
    test: acmeair-webapp
    classification: java-wrong
    direction: java-fewer
    summary: >
      For binary (WAR) input, the provider decompiled into a hidden flat .java-provider-work/ dir the
      engine couldn't discover, so discovery-rules / eap / jakarta / technology-usage produced nothing.
    resolution: >
      ArchiveHandler restructured to a Go-compatible Maven layout under java-project/ (src/main/java,
      src/main/webapp, extracted/synthetic pom.xml); dep work dir moved outside the source tree.
    evidence: FAILING_TESTS.md#1-acmeair-webapp
    status: fixed

  - id: tomcat-legacy-bom-transitive-deps
    test: tomcat-legacy
    classification: java-wrong
    direction: java-fewer
    summary: >
      Transitive deps (Micrometer via spring-boot-starter-actuator, Spring DI via spring-data-jpa) are
      missed: findManagedVersion can't resolve versions from BOM imports (scope=import,type=pom), Aether
      collection fails, and the Maven fallback only returns direct deps.
    resolution: >
      Implemented recursive, parent-aware BOM-import resolution in MavenBuildTool
      (findVersionInBom now recurses into nested import BOMs + walks the BOM parent chain;
      downloadBomPoms fetches the full BOM/parent closure). Covered by offline unit tests in
      MavenBuildToolTest. Validated online against the real spring-boot-dependencies:3.3.4 BOM:
      version-less spring-data-jpa resolves to 3.3.4 via the nested spring-data-bom import, and
      micrometer-core:1.13.4 appears transitively — matching `mvn dependency:tree` exactly.
      Still needs full E2E against tomcat-legacy itself (private Azure repo access/mirror required).
    tracked_by: MTA-8155
    evidence: FAILING_TESTS.md#5a
    status: fixed-pending-ci

  - id: tomcat-legacy-dep-pom-line-numbers
    test: tomcat-legacy
    classification: java-wrong
    direction: java-different
    summary: >
      Dependency rules (mvc-01220, observability-0100, database-03000, embedded-framework-08400) report
      incidents at pom.xml:0 instead of the expected lines (86, 96, 76, 91) when Aether fails and static
      pom parsing is used.
    resolution: >
      Add groupId/artifactId/pomPath to static-parsing extras so getDependencyLocation resolves lines.
      Verified: fix confirmed present in WorkspaceContext.getDependenciesFromStaticParsing, and the
      GetDependencyLocation RPC is now covered by DependencyLocationServiceTest (extras present ->
      correct line; extras missing -> line 0, degrades without crashing). Full E2E against tomcat-legacy
      still pending (deferred with the rest of the tomcat-legacy work).
    evidence: FAILING_TESTS.md#5b
    status: fixed-pending-ci

  - id: petclinic-startup-timeout
    test: petclinic-hazelcast-with-custom-rules
    classification: benign
    summary: Provider container intermittently exceeds the engine's 8m startup timeout on CI runners.
    resolution: CI infrastructure flake, not a provider bug; excluded from parity gating when it times out.
    evidence: FAILING_TESTS.md#3-petclinic
    status: excluded

  # NOTE: the earlier speculative `delta-*` / `drift-*` entries (Quarkus 3.40 baselines, new OpenJDK
  # rules, hibernate-orm7, quarkus maven-tooling message/link drift, tackle labelSelector,
  # nerd-dinner-full, "update test results") were removed. They were artifacts of the STALE forked
  # baseline (CI run 39956522958); the first differential run against vanilla main (40327871051) shows
  # none of them actually diverge, so they no longer need tracking. The `needs-triage` ones also had no
  # `test` scope and were acting as a global catch-all. This ledger now reflects the real observed
  # divergence set vs koncur main.
