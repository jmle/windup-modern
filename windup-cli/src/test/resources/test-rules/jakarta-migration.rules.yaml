rules:
  id: "jakarta-migration"
  phase: MIGRATION_RULES
  source-technology:
    id: "java-ee"
    version: "[7,8]"
  target-technology:
    id: "jakarta-ee"
    version: "[9,)"
  rules:
    - id: "javax-ejb-annotations"
      when:
        java-class:
          references: "javax.ejb.{*}"
          location: ANNOTATION
      perform:
        hint:
          title: "javax.ejb annotation must be migrated to jakarta.ejb"
          message: "Replace javax.ejb annotations with their jakarta.ejb equivalents. The javax.ejb package has been moved to jakarta.ejb as part of the Jakarta EE migration."
          effort: 1
          category: mandatory
          link:
            title: "Jakarta EE Migration Guide"
            url: "https://jakarta.ee/resources/jakarta-ee-migration/"

    - id: "javax-persistence-annotations"
      when:
        java-class:
          references: "javax.persistence.{*}"
          location: ANNOTATION
      perform:
        hint:
          title: "javax.persistence annotation must be migrated to jakarta.persistence"
          message: "Replace javax.persistence annotations with their jakarta.persistence equivalents."
          effort: 1
          category: mandatory
          link:
            title: "Jakarta Persistence Migration"
            url: "https://jakarta.ee/specifications/persistence/"

    - id: "javax-xml-bind-annotations"
      when:
        java-class:
          references: "javax.xml.bind.annotation.{*}"
          location: ANNOTATION
      perform:
        hint:
          title: "javax.xml.bind annotation must be migrated"
          message: "Replace javax.xml.bind annotations with their jakarta.xml.bind equivalents."
          effort: 1
          category: mandatory
          link:
            title: "JAXB Migration Guide"
            url: "https://jakarta.ee/specifications/xml-binding/"

    - id: "javax-xml-bind-api-usage"
      when:
        java-class:
          references: "javax.xml.bind.{*}"
          location: IMPORT
      perform:
        hint:
          title: "javax.xml.bind import must be migrated"
          message: "Replace javax.xml.bind imports with their jakarta.xml.bind equivalents. JAXB was removed from the JDK in Java 11 and moved to Jakarta EE."
          effort: 3
          category: mandatory
          link:
            title: "JAXB Migration Guide"
            url: "https://jakarta.ee/specifications/xml-binding/"
