- ruleID: javax-ejb-annotations
  description: "javax.ejb annotation must be migrated to jakarta.ejb"
  message: "Replace javax.ejb annotations with their jakarta.ejb equivalents. The javax.ejb package has been moved to jakarta.ejb as part of the Jakarta EE migration."
  effort: 1
  category: mandatory
  labels:
    - "konveyor.io/source=java-ee7"
    - "konveyor.io/target=jakarta-ee9"
  links:
    - title: "Jakarta EE Migration Guide"
      url: "https://jakarta.ee/resources/jakarta-ee-migration/"
  when:
    java.referenced:
      pattern: "javax.ejb.{*}"
      location: ANNOTATION

- ruleID: javax-persistence-annotations
  description: "javax.persistence annotation must be migrated to jakarta.persistence"
  message: "Replace javax.persistence annotations with their jakarta.persistence equivalents."
  effort: 1
  category: mandatory
  labels:
    - "konveyor.io/source=java-ee7"
    - "konveyor.io/target=jakarta-ee9"
  links:
    - title: "Jakarta Persistence Migration"
      url: "https://jakarta.ee/specifications/persistence/"
  when:
    java.referenced:
      pattern: "javax.persistence.{*}"
      location: ANNOTATION

- ruleID: javax-xml-bind-annotations
  description: "javax.xml.bind annotation must be migrated"
  message: "Replace javax.xml.bind annotations with their jakarta.xml.bind equivalents."
  effort: 1
  category: mandatory
  labels:
    - "konveyor.io/source=java-ee7"
    - "konveyor.io/target=jakarta-ee9"
  links:
    - title: "JAXB Migration Guide"
      url: "https://jakarta.ee/specifications/xml-binding/"
  when:
    java.referenced:
      pattern: "javax.xml.bind.annotation.{*}"
      location: ANNOTATION

- ruleID: javax-xml-bind-api-usage
  description: "javax.xml.bind import must be migrated"
  message: "Replace javax.xml.bind imports with their jakarta.xml.bind equivalents. JAXB was removed from the JDK in Java 11 and moved to Jakarta EE."
  effort: 3
  category: mandatory
  labels:
    - "konveyor.io/source=java-ee7"
    - "konveyor.io/target=jakarta-ee9"
  links:
    - title: "JAXB Migration Guide"
      url: "https://jakarta.ee/specifications/xml-binding/"
  when:
    java.referenced:
      pattern: "javax.xml.bind.{*}"
      location: IMPORT
