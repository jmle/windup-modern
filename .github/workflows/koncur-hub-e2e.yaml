name: Koncur Hub Differential (vs main)

# In-cluster (Tackle Hub) counterpart of the CLI Koncur Differential workflow: runs the new Java
# provider through Tackle Hub against VANILLA koncur `main`, regenerates per-test output, and classifies
# every divergence vs the Go golden using the parity ledger (testing/koncur_triage.py).
#
# GATING: fails on any UNEXPLAINED/PENDING (a tracked java-wrong can be tolerated with --allow-known).
# The comparator is base-dir-independent (hub repo-subdir prefix) and the java-provider differential
# compares incidents only (tags are engine/ruleset-version-derived) over Java tests only — so the
# hub and CLI paths both come out clean. Heavy (Kind + Hub, ~90 min); nightly + manual.

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

# One hub run at a time: a manual dispatch supersedes an in-flight nightly (and vice versa) instead of
# running two Kind+Hub clusters at once — which previously left a confusing "cancelled" duplicate.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  koncur-hub-differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # Pinned kantra image (bundles rulesets at /opt/rulesets) for the triage's java-rule scoping.
      # Keep in sync with the ledger baseline.ruleset_ref. (The Hub analysis itself uses the analyzer
      # addon image; this pin only governs the ruleset version used to classify java vs builtin rules.)
      KANTRA_IMAGE: quay.io/konveyor/kantra@sha256:c57b12b64809017b8f8099da41f908e970343d79fda66f72409cc0aa23e9d3b2
    steps:
      - name: Checkout (this repo — triage script + ledger)
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install triage deps
        run: pip install pyyaml

      - name: Build fat JAR
        run: mvn package -DskipTests -q

      - name: Build Java provider image
        run: podman build -f Dockerfile.kantra -t localhost/java-provider:test .

      - name: Extract rulesets (for java-provider scoping)
        # Best-effort: pull the bundled rulesets from the kantra image so the triage can scope to
        # java-provider rules (java.referenced/java.dependency) and skip builtin-only rules. A rule's
        # capability is version-independent, so this is valid for the Hub path too. Safe by design: an
        # unknown/unfound rule is still compared, and a failed extraction => compare all (never masks).
        run: |
          set +e
          for p in /opt/rulesets /usr/local/etc/rulesets /root/.kantra/rulesets; do
            cid=$(podman create --name rs-extract "$KANTRA_IMAGE")
            if podman cp "$cid:$p" /tmp/rulesets 2>/dev/null && [ -d /tmp/rulesets ]; then
              podman rm "$cid" >/dev/null 2>&1
              echo "Extracted rulesets from kantra image: $p"
              break
            fi
            podman rm "$cid" >/dev/null 2>&1
          done
          if [ -d /tmp/rulesets ]; then
            echo "rulesets .yaml count: $(find /tmp/rulesets -name '*.yaml' | wc -l)"
          else
            echo "WARNING: could not extract rulesets; triage will compare all rules (unscoped)."
          fi
          exit 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Clone and build koncur (main)
        run: |
          git clone --depth 1 https://github.com/konveyor/koncur.git /tmp/koncur
          cd /tmp/koncur
          go build -o $HOME/.local/bin/koncur ./cmd/koncur/main.go
          mkdir -p $HOME/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.25.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Create Kind cluster and install Tackle Hub
        working-directory: /tmp/koncur
        run: |
          make kind-create
          make hub-install

      - name: Wait for Hub readiness
        run: |
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=tackle-hub \
            -n konveyor-tackle --timeout=300s

      - name: Load Java provider image into Kind
        run: |
          podman save localhost/java-provider:test -o /tmp/java-provider.tar
          kind load image-archive /tmp/java-provider.tar --name koncur-test
          rm /tmp/java-provider.tar

      - name: Start port-forward
        run: |
          kubectl port-forward -n konveyor-tackle svc/tackle-hub 8081:8080 &
          sleep 5
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8081/applications > /dev/null 2>&1; then
              echo "Hub API is ready"
              exit 0
            fi
            echo "Waiting for Hub API... attempt $i"
            sleep 5
          done
          echo "Hub API never became ready"
          exit 1

      - name: Create tackle-hub target config
        run: |
          mkdir -p /tmp/koncur/.koncur/config
          cat > /tmp/koncur/.koncur/config/target-tackle-hub.yaml << 'EOF'
          type: tackle-hub
          tackleHub:
            url: http://localhost:8081
            images:
              javaProvider: localhost/java-provider:test
          EOF

      - name: Exclude tests requiring a Maven dep-server (not replicated here)
        # Tests with `requireMavenSettings: true` (the tackle-testapp-* set) need koncur's local Maven
        # repository server + a mirror settings.xml, since their deps aren't on Central. That infra isn't
        # stood up here (it's exercised by koncur's own provider CI), and `koncur generate` has no
        # skip-maven flag — it just marks them failed. Drop them so the differential stays truthful.
        working-directory: /tmp/koncur
        run: |
          for d in tests/*/; do
            if grep -q "requireMavenSettings: true" "$d/test.yaml" 2>/dev/null; then
              echo "Excluding (requires maven dep-server infra): $(basename "$d")"
              rm -rf "$d"
            fi
          done

      - name: Regenerate outputs with the new provider (via Hub)
        working-directory: /tmp/koncur
        env:
          SKIP_MAVEN: "true"
        # Overwrites each tests/<t>/expected-output.yaml with the NEW provider's output (run through Hub).
        # The committed version (git HEAD) remains the Go golden of record.
        run: koncur generate -d tests -t tackle-hub --target-config .koncur/config/target-tackle-hub.yaml || true

      - name: Ledger-driven differential triage (gating)
        id: triage
        working-directory: /tmp/koncur
        run: |
          mkdir -p /tmp/triage-reports
          RS_ARG=""
          [ -d /tmp/rulesets ] && RS_ARG="--rulesets /tmp/rulesets"
          overall=0
          for d in tests/*/; do
            t=$(basename "$d")
            f="${d}expected-output.yaml"
            [ -f "$f" ] || continue
            golden=$(mktemp)
            if ! git show "HEAD:tests/$t/expected-output.yaml" > "$golden" 2>/dev/null; then
              rm -f "$golden"; continue
            fi
            echo "::group::triage $t"
            python3 "$GITHUB_WORKSPACE/testing/koncur_triage.py" \
              --ledger "$GITHUB_WORKSPACE/testing/koncur-parity-ledger.yaml" \
              --test "$t" --golden "$golden" --actual "$f" $RS_ARG \
              | tee "/tmp/triage-reports/$t.txt"
            rc=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then overall=1; echo "DIVERGENCE (unexplained/known): $t"; fi
            rm -f "$golden"
          done
          echo "overall_triage_rc=$overall" >> "$GITHUB_OUTPUT"
          echo "Overall triage exit code: $overall (advisory)"
          exit $overall

      - name: Summarize
        if: always()
        run: |
          echo "## Koncur Hub differential (vs main) — gating" >> "$GITHUB_STEP_SUMMARY"
          echo "Triage exit: ${{ steps.triage.outputs.overall_triage_rc }} (0 = all divergences explained by ledger)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -hE "^\[(UNEXPLAINED|PENDING|KNOWN_BUG|EXPLAINED)\]" /tmp/triage-reports/*.txt 2>/dev/null \
            | sort | uniq -c >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Show Hub status on failure
        if: failure()
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -n konveyor-tackle
          echo ""
          echo "=== Hub Logs ==="
          kubectl logs -n konveyor-tackle -l app.kubernetes.io/name=tackle-hub --tail=100 || true
          echo ""
          echo "=== Java Provider Pods ==="
          kubectl logs -n konveyor-tackle -l app.kubernetes.io/name=java-external-provider --tail=50 || true

      - name: Upload triage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: koncur-hub-triage
          path: /tmp/triage-reports
          retention-days: 14

      - name: Upload regenerated outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: koncur-hub-outputs
          path: /tmp/koncur/tests/**/expected-output.yaml
          retention-days: 14

      - name: Cleanup Kind cluster
        if: always()
        run: kind delete cluster --name koncur-test || true
