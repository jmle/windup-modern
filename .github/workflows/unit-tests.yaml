name: Unit Tests

# Fast per-PR gate: runs the JUnit suite (symbol index, build-tool/BOM resolution, dependency-location
# RPC, etc.) plus the triage harness unit tests. Full E2E correctness is covered nightly by the
# Koncur Differential workflow.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  junit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run JUnit tests
        run: mvn -B test

  triage-harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install pyyaml

      - name: Run triage harness unit tests
        working-directory: testing
        run: python3 -m unittest -v test_koncur_triage
