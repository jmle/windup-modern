name: Soak

# Leak/soak check (MTA-8157 Phase 4): churn many Init -> evaluate -> Stop cycles through one long-lived
# provider and assert nothing leaks (workspace registry, threads, heap), tracking the heap/RSS/thread
# trend. Nightly + manual; a bit long, so not per-PR.

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      cycles:
        description: "Init/Stop cycles"
        default: "500"
        required: false

jobs:
  soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run soak test
        run: mvn -B -Dsoak=true -Dsoak.cycles=${{ github.event.inputs.cycles || '500' }} -Dtest=SoakTest test

      - name: Soak report to summary
        if: always()
        run: |
          if [ -f target/soak-report.txt ]; then
            { echo '```'; cat target/soak-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload soak report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-report
          path: target/soak-report.txt
          retention-days: 14
