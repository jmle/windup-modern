name: Koncur Differential (vs main)

# Runs the new Java provider against VANILLA koncur `main` (not the pinned forked golden branch),
# regenerates the provider's output per test, and classifies every divergence vs the Go golden using
# the parity ledger (testing/koncur_triage.py). GATING: the job fails if any divergence is UNEXPLAINED
# or PENDING (a tracked java-wrong can be tolerated with --allow-known). Runs nightly + on demand
# (heavy: ~90 min). Replaces the stale forked-baseline koncur-e2e job (MTA-8152). Per-PR correctness is
# guarded by the lighter unit-tests workflow.

on:
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * *'

# One differential run at a time: a manual dispatch supersedes an in-flight nightly instead of running
# two in parallel.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  koncur-differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # Pinned kantra image (bundles the rulesets at /opt/rulesets). Keep in sync with the ledger
      # baseline.ruleset_ref / kantra_image. Pinning the digest makes the kantra binary AND the ruleset
      # version reproducible instead of tracking mutable :latest.
      KANTRA_IMAGE: quay.io/konveyor/kantra@sha256:c57b12b64809017b8f8099da41f908e970343d79fda66f72409cc0aa23e9d3b2
    steps:
      - name: Checkout (this repo — triage script + ledger)
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install triage deps
        run: pip install pyyaml

      - name: Build fat JAR
        run: mvn package -DskipTests -q

      - name: Build Java provider image
        run: podman build -f Dockerfile.kantra -t localhost/java-provider:test .

      - name: Add local bin to PATH
        run: |
          mkdir -p $HOME/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install kantra
        run: |
          podman cp $(podman create --name kantra-extract "$KANTRA_IMAGE"):/usr/local/bin/kantra . && \
            podman rm kantra-extract
          install -m 755 kantra $HOME/.local/bin/kantra
          rm kantra

      - name: Extract rulesets (for java-provider scoping)
        # Best-effort: pull the bundled rulesets from the same kantra image so the triage can scope to
        # java-provider rules (java.referenced/java.dependency) and ignore builtin-only rules. Safe by
        # design — if this can't find them, the triage simply compares ALL rules (today's behavior), and
        # a version/path mismatch only ever leaves a rule UN-skipped (never masks a divergence).
        run: |
          set +e
          for p in /opt/rulesets /usr/local/etc/rulesets /root/.kantra/rulesets; do
            cid=$(podman create --name rs-extract "$KANTRA_IMAGE")
            if podman cp "$cid:$p" /tmp/rulesets 2>/dev/null && [ -d /tmp/rulesets ]; then
              podman rm "$cid" >/dev/null 2>&1
              echo "Extracted rulesets from kantra image: $p"
              break
            fi
            podman rm "$cid" >/dev/null 2>&1
          done
          if [ -d /tmp/rulesets ]; then
            echo "rulesets .yaml count: $(find /tmp/rulesets -name '*.yaml' | wc -l)"
          else
            echo "WARNING: could not extract rulesets; triage will compare all rules (unscoped)."
          fi
          exit 0

      - name: Configure container networking
        run: |
          mkdir -p $HOME/.config/containers
          cat > $HOME/.config/containers/containers.conf << 'EOF'
          [network]
          network_cmd_options = ["allow_host_loopback=true"]
          EOF

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Clone and build koncur (main)
        run: |
          git clone --depth 1 https://github.com/konveyor/koncur.git /tmp/koncur
          cd /tmp/koncur
          go build -o $HOME/.local/bin/koncur ./cmd/koncur/main.go

      # Serve koncur's committed local-maven-resources (the tackle-testapp deps, which aren't on Central)
      # so `requireMavenSettings` tests can resolve them — mirrors koncur's own kantra.yaml (no GitHub
      # auth; the deps are checked into koncur). The provider runs containerless and reaches the host via
      # host.containers.internal (host-loopback is already enabled above).
      - name: Serve local-maven-resources
        run: |
          echo "NETWORK_GATEWAY=host.containers.internal" >> "$GITHUB_ENV"
          nohup python3 -m http.server 8085 --directory /tmp/koncur/local-maven-resources \
            > /tmp/maven-httpd.log 2>&1 &
          for i in $(seq 1 10); do curl -sf http://localhost:8085/ >/dev/null && break || sleep 1; done
          echo "maven resources: $(find /tmp/koncur/local-maven-resources -name '*.jar' | wc -l) jars"

      - name: Create maven settings file
        uses: s4u/maven-settings-action@v4.0.0
        with:
          githubServer: false
          repositories: '[{"id": "tackle-testapp-public", "name": "Local tackle-testapp repo", "url": "http://${{ env.NETWORK_GATEWAY }}:8085"}]'
          mirrors: '[{"id": "maven-default-http-blocker", "name": "disable http block", "mirrorOf": "tackle-testapp-public", "url": "http://${{ env.NETWORK_GATEWAY }}:8085", "blocked": false}]'
          path: ${{ runner.temp }}/settings.xml

      - name: Create target config
        run: |
          mkdir -p /tmp/koncur/.koncur/config
          cat > /tmp/koncur/.koncur/config/target-kantra.yaml << EOF
          type: kantra
          kantra:
            javaProviderImage: localhost/java-provider:test
            mavenSettings: ${{ runner.temp }}/settings.xml
          EOF

      - name: Regenerate outputs with the new provider
        working-directory: /tmp/koncur
        env:
          SKIP_MAVEN: "true"
        # Overwrites each tests/<t>/expected-output.yaml with the NEW provider's output.
        # The committed version (git HEAD) remains the Go golden of record.
        run: koncur generate -d tests -t kantra || true

      - name: Ledger-driven differential triage (gating)
        id: triage
        working-directory: /tmp/koncur
        run: |
          mkdir -p /tmp/triage-reports
          RS_ARG=""
          [ -d /tmp/rulesets ] && RS_ARG="--rulesets /tmp/rulesets"
          overall=0
          for d in tests/*/; do
            t=$(basename "$d")
            f="${d}expected-output.yaml"
            [ -f "$f" ] || continue
            golden=$(mktemp)
            if ! git show "HEAD:tests/$t/expected-output.yaml" > "$golden" 2>/dev/null; then
              rm -f "$golden"; continue
            fi
            echo "::group::triage $t"
            python3 "$GITHUB_WORKSPACE/testing/koncur_triage.py" \
              --ledger "$GITHUB_WORKSPACE/testing/koncur-parity-ledger.yaml" \
              --test "$t" --golden "$golden" --actual "$f" $RS_ARG \
              | tee "/tmp/triage-reports/$t.txt"
            rc=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then overall=1; echo "DIVERGENCE (unexplained/known): $t"; fi
            rm -f "$golden"
          done
          echo "overall_triage_rc=$overall" >> "$GITHUB_OUTPUT"
          echo "Overall triage exit code: $overall (advisory)"
          exit $overall

      - name: Summarize
        if: always()
        run: |
          echo "## Koncur differential (vs main) — advisory" >> "$GITHUB_STEP_SUMMARY"
          echo "Triage exit: ${{ steps.triage.outputs.overall_triage_rc }} (0 = all divergences explained by ledger)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -hE "^\[(UNEXPLAINED|PENDING|KNOWN_BUG|EXPLAINED)\]" /tmp/triage-reports/*.txt 2>/dev/null \
            | sort | uniq -c >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload triage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: koncur-differential-triage
          path: /tmp/triage-reports
          retention-days: 14

      - name: Upload regenerated outputs (for ledger triage)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: koncur-differential-outputs
          path: /tmp/koncur/tests/**/expected-output.yaml
          retention-days: 14
